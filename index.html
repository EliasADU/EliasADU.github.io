<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Elias & Fiorella's Wedding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="top-bg"></div>

    <div id="content">

        <div id="header">
            <h1>Vyulettes Artbook</h1>
        </div>

        <div class="controls">
            <button id="prevTop">← Previous</button>

            <select id="pageSize">
                <option value="5">5 Images</option>
                <option value="10" selected>10 Images</option>
                <option value="20">20 Images</option>
                <option value="50">50 Images</option>
            </select>

            <button id="nextTop">Next →</button>
        </div>

        <div id="gallery"></div>

        <div class="controls">
            <button id="prevBottom">← Previous</button>

            <select id="pageSizeMirror">
                <option value="5">5 Images</option>
                <option value="10" selected>10 Images</option>
                <option value="20">20 Images</option>
                <option value="50">50 Images</option>
            </select>

            <button id="nextBottom">Next →</button>
        </div>

    </div>

    <div id="bottom-bg"></div>

    <script src="script.js"></script>

</body>
</html>
